# Frontend Deployment Workflow Template
# growthmaker-dashboard에서 사용 중인 실제 워크플로우 구조

name: Vercel CI/CD (main→production · staging→staging · develop→preview)

on:
  push:
    branches: [main, staging, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for CLI only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Deploy to Vercel
        id: vercel
        run: |
          # Detach Git context to avoid Git author verification by Vercel
          rm -rf .git || true
          unset GITHUB_ACTIONS GITHUB_REF GITHUB_REF_NAME GITHUB_REPOSITORY GITHUB_SHA GITHUB_HEAD_REF GITHUB_BASE_REF GITHUB_ACTOR || true
          export VERCEL_GIT_COMMIT_SHA="" VERCEL_GIT_COMMIT_AUTHOR_EMAIL="" VERCEL_GIT_COMMIT_AUTHOR_NAME="" VERCEL_GIT_REPO_SLUG="" VERCEL_GIT_REPO_OWNER="" VERCEL_GIT_PROVIDER=""

          if [ "${{ github.ref_name }}" = "main" ]; then
            npx vercel@latest pull --yes --environment=production --token="${{ env.VERCEL_TOKEN }}"
            npx vercel@latest build --prod --token="${{ env.VERCEL_TOKEN }}"
            URL=$(npx vercel@latest deploy --prebuilt --prod --yes --token="${{ env.VERCEL_TOKEN }}")
            echo "DEPLOY_ENV=Production" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            npx vercel@latest pull --yes --environment=preview --token="${{ env.VERCEL_TOKEN }}"
            npx vercel@latest build --token="${{ env.VERCEL_TOKEN }}"
            URL=$(npx vercel@latest deploy --prebuilt --yes --token="${{ env.VERCEL_TOKEN }}")
            echo "DEPLOY_ENV=Staging" >> "$GITHUB_ENV"
          else
            npx vercel@latest pull --yes --environment=preview --token="${{ env.VERCEL_TOKEN }}"
            npx vercel@latest build --token="${{ env.VERCEL_TOKEN }}"
            URL=$(npx vercel@latest deploy --prebuilt --yes --token="${{ env.VERCEL_TOKEN }}")
            echo "DEPLOY_ENV=Preview" >> "$GITHUB_ENV"
          fi
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: success()
        run: |
          {
            echo "### ✅ Vercel Deploy"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Environment: ${DEPLOY_ENV}"
            echo "- URL: ${DEPLOY_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
