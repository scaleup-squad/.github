# Backend Deployment Workflow Template
# growthmaker-backend에서 사용 중인 실제 워크플로우
# 브랜치: develop → dev, staging → stage, main → prod

name: Deploy growthmaker-backend (dev/stage/prod)

on:
  push:
    branches:
      - develop
      - staging
      - main

concurrency:
  group: growthmaker-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: growthmaker-backend

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to DEV
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ${{ secrets.DEV_DEPLOY_USER }}
          key: ${{ secrets.DEV_DEPLOY_KEY }}
          script: |
            ~/deploy-growthmaker-backend.sh dev

  deploy-stage:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to STAGE
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_DEPLOY_HOST }}
          username: ${{ secrets.STAGE_DEPLOY_USER }}
          key: ${{ secrets.STAGE_DEPLOY_KEY }}
          script: |
            ~/deploy-growthmaker-backend.sh stage

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to PROD
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_KEY }}
          script: |
            ~/deploy-growthmaker-backend.sh prod
