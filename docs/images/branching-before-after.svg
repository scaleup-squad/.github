<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">예전 방식과 지금 방식 비교</title>
  <desc id="d">예전에는 모든 작업이 staging 브랜치에 쌓인 뒤 반영 PR 하나로 한꺼번에 prod 에 나갔다. 지금은 PR 하나씩 main 에 머지되어 각각 prod 에 나가고, staging 서버는 확인할 때만 따로 올린다.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
    <marker id="or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
    .title { font-size: 17px; font-weight: 800; }
    .h { font-size: 14px; font-weight: 700; fill: #111827; }
    .s { font-size: 12px; fill: #6b7280; }
    .lbl { font-size: 12px; font-weight: 600; }
    .f { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
  </style>

  <!-- BEFORE panel -->
  <rect x="0.5" y="0.5" width="469" height="419" rx="16" fill="#fef2f2" stroke="#fecaca"/>
  <text x="28" y="40" class="title" style="fill:#b91c1c">예전 (~2026-11-02)</text>
  <text x="28" y="62" class="s">모두 staging 브랜치에 합류 → 쌓인 것 전부가 한 번에 prod 로</text>

  <rect x="28" y="96" width="110" height="44" rx="10" class="f"/><text x="83" y="123" text-anchor="middle" class="h">feature A</text>
  <rect x="28" y="168" width="110" height="44" rx="10" class="f"/><text x="83" y="195" text-anchor="middle" class="h">feature B</text>
  <rect x="28" y="240" width="110" height="44" rx="10" class="f"/><text x="83" y="267" text-anchor="middle" class="h">feature C</text>

  <!-- staging branch bucket -->
  <path d="M190,140 L190,250 A50,14 0 0 0 290,250 L290,140" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <ellipse cx="240" cy="140" rx="50" ry="14" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="200" text-anchor="middle" class="h" style="fill:#b91c1c">staging</text>
  <text x="240" y="218" text-anchor="middle" class="h" style="fill:#b91c1c">브랜치</text>

  <path d="M140,118 C165,118 165,170 186,176" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#g)"/>
  <line x1="140" y1="190" x2="186" y2="194" stroke="#6b7280" stroke-width="2" marker-end="url(#g)"/>
  <path d="M140,262 C165,262 165,220 186,214" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#g)"/>

  <rect x="350" y="168" width="96" height="52" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="398" y="191" text-anchor="middle" class="h">main</text>
  <text x="398" y="209" text-anchor="middle" class="s">= prod</text>

  <line x1="292" y1="186" x2="346" y2="186" stroke="#ef4444" stroke-width="3" marker-end="url(#rd)"/>
  <text x="320" y="160" text-anchor="middle" class="lbl" style="fill:#b91c1c">반영 PR</text>
  <path d="M348,208 C325,240 305,240 292,228" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rd)"/>
  <text x="322" y="258" text-anchor="middle" class="lbl" style="fill:#b91c1c">역반영</text>

  <rect x="28" y="326" width="414" height="64" rx="10" fill="#ffffff" stroke="#fecaca"/>
  <text x="44" y="352" class="lbl" style="fill:#b91c1c">✗ 한 사람의 검증이 늦으면 모두 prod 에 못 나감</text>
  <text x="44" y="374" class="s">반영 PR · 역반영 · 긴급 수정용 별도 경로가 매번 필요</text>

  <!-- AFTER panel -->
  <rect x="490.5" y="0.5" width="469" height="419" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="518" y="40" class="title" style="fill:#047857">지금 (2026-11-03~)</text>
  <text x="518" y="62" class="s">PR 하나씩 main 으로. staging 서버는 확인할 때만 따로 올림</text>

  <rect x="740" y="92" width="190" height="52" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="835" y="115" text-anchor="middle" class="h" style="fill:#c2410c">staging 서버</text>
  <text x="835" y="133" text-anchor="middle" class="s">공용 미리보기 · 브랜치 아님</text>

  <rect x="518" y="168" width="110" height="44" rx="10" class="f"/><text x="573" y="195" text-anchor="middle" class="h">feature A</text>
  <rect x="518" y="248" width="110" height="44" rx="10" class="f"/><text x="573" y="275" text-anchor="middle" class="h">feature B</text>

  <path d="M630,178 C690,160 700,125 736,120" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#or)"/>
  <text x="664" y="140" text-anchor="middle" class="lbl" style="fill:#c2410c">올려서 확인</text>

  <rect x="820" y="206" width="110" height="52" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="875" y="229" text-anchor="middle" class="h">main</text>
  <text x="875" y="247" text-anchor="middle" class="s">= prod</text>

  <path d="M630,196 C730,196 760,222 816,226" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#gr)"/>
  <text x="720" y="190" text-anchor="middle" class="lbl" style="fill:#047857">PR</text>
  <path d="M630,268 C730,268 760,244 816,240" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#gr)"/>
  <text x="720" y="286" text-anchor="middle" class="lbl" style="fill:#047857">PR</text>

  <rect x="518" y="326" width="414" height="64" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="534" y="352" class="lbl" style="fill:#047857">✓ PR 마다 독립적으로 prod 에 나감</text>
  <text x="534" y="374" class="s">반영 PR · 역반영 없음 · 긴급 수정도 같은 길</text>
</svg>
