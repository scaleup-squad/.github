<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">작업 흐름 7단계</title>
  <desc id="d">main 에서 분기, 로컬 검사, PR 생성, CI 자동 검사, staging 서버 확인, 승인 후 squash 머지, prod 자동 배포. CI 실패나 staging 문제가 있으면 고쳐서 다시 검사한다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
    .n { font-size: 13px; font-weight: 800; fill: #ffffff; }
    .h { font-size: 15px; font-weight: 700; fill: #111827; }
    .s { font-size: 12px; fill: #6b7280; }
    .w { font-size: 12px; font-weight: 600; fill: #ef4444; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- retry loop: CI(4) back to local check(2) -->
  <path d="M790,104 C790,40 380,40 380,96" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="585" y="44" text-anchor="middle" class="w">실패하면 고쳐서 ② 부터 다시</text>

  <!-- row 1 -->
  <g>
    <rect x="40" y="104" width="190" height="78" rx="12" class="box"/>
    <circle cx="66" cy="130" r="13" fill="#2563eb"/><text x="66" y="135" text-anchor="middle" class="n">1</text>
    <text x="88" y="135" class="h">브랜치 만들기</text>
    <text x="58" y="162" class="s">최신 origin/main 에서 분기</text>
  </g>
  <line x1="232" y1="143" x2="272" y2="143" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="276" y="104" width="190" height="78" rx="12" class="box"/>
    <circle cx="302" cy="130" r="13" fill="#2563eb"/><text x="302" y="135" text-anchor="middle" class="n">2</text>
    <text x="324" y="135" class="h">로컬 검사</text>
    <text x="294" y="162" class="s">타입·테스트·빌드 통과</text>
  </g>
  <line x1="468" y1="143" x2="508" y2="143" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="512" y="104" width="190" height="78" rx="12" class="box"/>
    <circle cx="538" cy="130" r="13" fill="#2563eb"/><text x="538" y="135" text-anchor="middle" class="n">3</text>
    <text x="560" y="135" class="h">PR 만들기</text>
    <text x="530" y="162" class="s">대상(base)은 항상 main</text>
  </g>
  <line x1="704" y1="143" x2="744" y2="143" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="748" y="104" width="180" height="78" rx="12" class="box"/>
    <circle cx="774" cy="130" r="13" fill="#2563eb"/><text x="774" y="135" text-anchor="middle" class="n">4</text>
    <text x="796" y="135" class="h">CI 자동 검사</text>
    <text x="766" y="162" class="s">PR 올리면 자동 실행</text>
  </g>

  <!-- down to row 2 -->
  <path d="M838,184 L838,236" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="848" y="215" class="s" style="fill:#10b981;font-weight:600">통과</text>

  <!-- row 2 (right to left) -->
  <g>
    <rect x="712" y="240" width="216" height="92" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <circle cx="738" cy="266" r="13" fill="#f97316"/><text x="738" y="271" text-anchor="middle" class="n">5</text>
    <text x="760" y="271" class="h">staging 에서 확인</text>
    <text x="730" y="296" class="s">브랜치를 수동 실행으로 올림</text>
    <text x="730" y="316" class="w">문제 있으면 ② 로</text>
  </g>
  <line x1="710" y1="286" x2="670" y2="286" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="476" y="250" width="190" height="72" rx="12" class="box"/>
    <circle cx="502" cy="276" r="13" fill="#2563eb"/><text x="502" y="281" text-anchor="middle" class="n">6</text>
    <text x="524" y="281" class="h">승인 → 머지</text>
    <text x="494" y="306" class="s">리드 승인 · squash 머지</text>
  </g>
  <line x1="474" y1="286" x2="434" y2="286" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="240" y="250" width="190" height="72" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="266" cy="276" r="13" fill="#10b981"/><text x="266" y="281" text-anchor="middle" class="n">7</text>
    <text x="288" y="281" class="h">prod 자동 배포</text>
    <text x="258" y="306" class="s">배포 성공·화면까지 확인</text>
  </g>

  <text x="40" y="374" class="s">②~④ 는 PR 마다 반복될 수 있다. ⑤ 는 화면·동작 확인이 필요한 변경에서 권장.</text>
</svg>
