name: Pick Runner (dynamic hosted↔macbook fallback)

# 호출 측 워크플로우가 jobs 앞단에 이 reusable workflow를 두고,
# 각 잡 runs-on: ${{ fromJSON(needs.pick.outputs.labels) }} 로 동적 선택.
#
# 로직: 당월 GitHub-hosted Actions 사용량(분) 조회
#  - usage < threshold(기본 1800)        → ubuntu-latest (무료분 활용)
#  - usage >= threshold + 맥북 online      → [self-hosted, macbook-fallback]
#  - usage >= threshold + 맥북 offline     → ubuntu-latest + Slack 경고 (1800~2000 버퍼로 버팀)
#  - billing API 조회 실패                 → ubuntu-latest (안전 degrade, 배포 막힘 방지)
#
# 이 pick 잡 자체는 [self-hosted, gos-ec2] (EC2)에서 실행 — 한도 0이어도 무조건 도는 닭-달걀 방지.
# (맥북이 아닌 EC2 고정: 맥북이 busy/offline이어도 pick은 항상 떠야 함)

on:
  workflow_call:
    inputs:
      threshold:
        description: 'hosted→fallback 전환 임계치(분). 기본 1800 (무료 2000의 90%)'
        required: false
        type: number
        default: 1800
    outputs:
      labels:
        description: 'runs-on 에 넣을 JSON 배열 문자열 (fromJSON 으로 파싱)'
        value: ${{ jobs.pick.outputs.labels }}
      usage:
        description: '당월 hosted 사용량(분)'
        value: ${{ jobs.pick.outputs.usage }}
      source:
        description: 'hosted | macbook | hosted-overflow | hosted-apifail'
        value: ${{ jobs.pick.outputs.source }}
  workflow_dispatch:
    inputs:
      threshold:
        description: '테스트용 임계치 override (0 으로 낮추면 강제 폴백 테스트)'
        required: false
        type: number
        default: 1800

jobs:
  pick:
    runs-on: [self-hosted, gos-ec2]
    outputs:
      labels: ${{ steps.decide.outputs.labels }}
      usage: ${{ steps.decide.outputs.usage }}
      source: ${{ steps.decide.outputs.source }}
    steps:
      - name: Decide runner by billing usage
        id: decide
        env:
          BILLING_TOKEN: ${{ secrets.BILLING_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          THRESHOLD: ${{ inputs.threshold }}
          ORG: scaleup-squad
        shell: bash
        run: |
          set -uo pipefail
          export MONTH=$(date -u +%Y-%m)
          API="https://api.github.com"
          AUTH="Authorization: Bearer ${BILLING_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"

          # --- 당월 hosted 사용량(분) (조회/파싱 실패 시 -1) ---
          BILL=$(curl -s -H "$AUTH" -H "$ACCEPT" "${API}/organizations/${ORG}/settings/billing/usage" 2>/dev/null) || true
          USAGE=$(printf '%s' "$BILL" | python3 -c "import json,sys,os; d=json.load(sys.stdin); m=os.environ['MONTH']; items=d.get('usageItems'); print(int(round(sum(float(i.get('quantity',0) or 0) for i in items if i.get('product')=='actions' and i.get('unitType')=='Minutes' and str(i.get('date','')).startswith(m)))) if isinstance(items,list) else -1)" 2>/dev/null || echo "-1")

          # --- 맥북 runner online? ---
          RUNNERS=$(curl -s -H "$AUTH" -H "$ACCEPT" "${API}/orgs/${ORG}/actions/runners" 2>/dev/null) || true
          MACBOOK_ONLINE=$(printf '%s' "$RUNNERS" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if any(r.get('name')=='macbook-fallback' and r.get('status')=='online' for r in (d.get('runners') or [])) else 'false')" 2>/dev/null || echo "false")

          # --- 결정 ---
          if [ "$USAGE" -lt 0 ]; then
            LABELS='["ubuntu-latest"]'; SOURCE=hosted-apifail
            echo "::warning::billing API 조회 실패 — ubuntu-latest 로 안전 진행 (BILLING_TOKEN scope/네트워크 확인)"
          elif [ "$USAGE" -lt "$THRESHOLD" ]; then
            LABELS='["ubuntu-latest"]'; SOURCE=hosted
          elif [ "$MACBOOK_ONLINE" = "true" ]; then
            LABELS='["self-hosted","macbook-fallback"]'; SOURCE=macbook
          else
            LABELS='["ubuntu-latest"]'; SOURCE=hosted-overflow
            if [ -n "${SLACK_WEBHOOK:-}" ]; then
              curl -s -X POST -H 'Content-type: application/json' -d "{\"text\":\"⚠️ *GitHub Actions 한도 초과 + 폴백 불가*\n당월 ${USAGE}/${THRESHOLD}분 사용. macbook-fallback runner *offline*.\nubuntu-latest 로 진행 중이나 2000분 소진 시 배포 큐 막힘.\n→ 맥북에서 svc.sh start 실행 권장\"}" "$SLACK_WEBHOOK" >/dev/null 2>&1 || true
            fi
          fi

          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
          echo "usage=$USAGE" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "::notice::runner=$SOURCE labels=$LABELS usage=${USAGE}/${THRESHOLD}min macbook_online=$MACBOOK_ONLINE"
