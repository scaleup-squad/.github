name: Gitleaks (reusable)

# 새로 들어온 커밋에서 비밀값(API 키·토큰·비밀번호)을 찾으면 실패한다 (gos-harness #53 · #83).
# 각 레포의 .github/workflows/gitleaks.yml(pull_request + 모든 브랜치 push 트리거)이 이 워크플로를 부른다 — 로직은 여기 한 벌.
# 버전·체크섬을 올릴 땐 여기만 고친다(호출 측이 @main 을 보므로 머지 즉시 전 레포 적용).
#
# - 범위: 새로 들어온 커밋만. 과거 이력은 보지 않는다(이미 교체한 옛 유출 키로 매번 실패하지 않게).
#   · pull_request → PR base..head
#   · push         → before..after. 새 브랜치(또는 force push 로 before 가 사라진 경우)는
#                    다른 원격 브랜치 어디에도 없는 커밋만
#   push 검사는 사후 탐지다 — 실패하면 비밀값은 이미 GitHub 에 올라간 상태이므로 키를 교체할 것.
# - 파일 종류 무관: .md·docs·.claude 도 본다 — 09월 유출 경로가 .claude/settings.local.json 이었다.
# - 오탐(테스트용 가짜 값 등)은 그 줄 끝에 `gitleaks:allow` 주석을 달아 제외한다.
# - 도구: gitleaks CLI 버전 고정 + 체크섬 검증(공식 Action 은 조직 계정에 라이선스 키가 필요해 쓰지 않는다).
# ⚠️ 이 레포는 공개라 다른 레포가 관리자 설정 없이 부를 수 있다 — 비밀값은 필요 없고 두지도 않는다.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    # 브랜치 삭제 push 는 검사할 커밋이 없다
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            pull_request)
              RANGE="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                RANGE="${AFTER} --not --exclude=refs/remotes/origin/${BRANCH} --remotes"
              else
                RANGE="${BEFORE}..${AFTER}"
              fi ;;
            *)
              echo "::error::지원하지 않는 이벤트: $EVENT (pull_request·push 만)"; exit 1 ;;
          esac
          echo "scan range: $RANGE"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$RANGE" --redact --verbose --no-banner .
